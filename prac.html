<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #fff;
        }

        .location-box {
            position: relative;
            width: 452px;
        }

        .location-select {
            height: 60px;
            border: 1px solid #2878ff;
            border-radius: 8px;
            padding-left: 48px;
            font-size: 20px;
            color: #111;
            box-shadow: none !important;
            background-color: #fff;
        }

        .location-select:focus {
            border-color: #2878ff;
        }

        .location-icon {
            position: absolute;
            left: 17px;
            top: 18px;
            color: #347cff;
            font-size: 22px;
            z-index: 2;
        }

        /* Custom dropdown */
        .location-dropdown {
            width: 452px;
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,.15);
            border-radius: 0 0 3px 3px;
            padding: 10px 15px;
        }

        .dropdown-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 2px 15px;
        }

        .current-location {
            color: #377dff;
            font-weight: 600;
        }

        .see-all {
            color: #000;
            font-weight: 600;
        }

        .popular {
            color: #444;
            font-weight: 600;
            margin: 10px 0;
        }

        .city {
            height: 62px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e5e5e5;
            font-size: 20px;
            color: #111;
            cursor: pointer;
        }

        .city:hover {
            background: #f5f8ff;
        }

        .city:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <div class="location-box">

        <!-- Bootstrap Select -->
        <select class="form-select location-select">
            <option selected>Pakistan</option>
            <option>Lahore</option>
            <option>Karachi</option>
            <option>Islamabad</option>
            <option>Rawalpindi</option>
            <option>Faisalabad</option>
        </select>

        <!-- Location Icon -->
        <span class="location-icon">📍</span>

        <!-- Custom Dropdown -->
        <div class="location-dropdown">

            <div class="dropdown-top">
                <div class="current-location">
                    📍 Use Current Location
                </div>

                <div class="see-all">
                    See all in Pakistan
                </div>
            </div>

            <div class="popular">
                Popular
            </div>

            <div class="city">Lahore</div>
            <div class="city">Karachi</div>
            <div class="city">Islamabad</div>
            <div class="city">Rawalpindi</div>
            <div class="city">Faisalabad</div>

        </div>

    </div>

</div>

</body>
</html>
